[project]
name = "campuscrave-api"
version = "0.1.0"
description = "CampusCrave canteen ordering API — the brains behind the token"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
prod = ["psycopg[binary]>=3.2"]

[project.scripts]
campuscrave = "campuscrave_api.main:run"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["campuscrave_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
